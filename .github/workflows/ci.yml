name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded PR runs share a group; main runs keep their own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:publication
      - name: Check source whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
